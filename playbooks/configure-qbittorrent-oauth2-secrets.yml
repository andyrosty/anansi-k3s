---
- name: Configure qBittorrent oauth2-proxy secrets
  hosts: k3s_control
  become: true
  gather_facts: false

  tasks:
    - name: Check that qBittorrent oauth2 client secret was provided
      ansible.builtin.assert:
        that:
          - qbittorrent_oauth2_client_secret is defined
          - qbittorrent_oauth2_client_secret | length > 0
        fail_msg: |
          Missing qbittorrent_oauth2_client_secret.
          Create the encrypted Vault file, then run:
          ansible-playbook playbooks/configure-qbittorrent-oauth2-secrets.yml --ask-vault-pass -e @inventory/group_vars/qbittorrent-oauth2-secrets.yml

    - name: Check that qBittorrent oauth2 cookie secret was provided
      ansible.builtin.assert:
        that:
          - qbittorrent_oauth2_cookie_secret is defined
          - qbittorrent_oauth2_cookie_secret | length > 0
        fail_msg: |
          Missing qbittorrent_oauth2_cookie_secret.
          Generate one with:
          openssl rand -base64 32

    - name: Wait for qBittorrent namespace
      ansible.builtin.command: k3s kubectl get namespace qbittorrent
      register: qbittorrent_namespace
      changed_when: false
      retries: 30
      delay: 5
      until: qbittorrent_namespace.rc == 0

    - name: Create or update qBittorrent oauth2-proxy secret
      ansible.builtin.shell: |
        k3s kubectl create secret generic qbittorrent-oauth2-proxy-secret \
          --namespace qbittorrent \
          --from-literal=client-secret={{ qbittorrent_oauth2_client_secret | quote }} \
          --from-literal=cookie-secret={{ qbittorrent_oauth2_cookie_secret | quote }} \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: true
      no_log: true

    - name: Verify qBittorrent oauth2-proxy secret exists
      ansible.builtin.command: >
        k3s kubectl get secret qbittorrent-oauth2-proxy-secret
        -n qbittorrent
      changed_when: false
