---
- name: Configure Keycloak secrets
  hosts: k3s_control
  become: true
  gather_facts: false

  tasks:
    - name: Check that Keycloak database password was provided
      ansible.builtin.assert:
        that:
          - keycloak_db_password is defined
          - keycloak_db_password | length > 0
        fail_msg: |
          Missing Keycloak database password.
          Create the encrypted Vault file described in the README, then run:
          ansible-playbook playbooks/configure-keycloak-secrets.yml --ask-vault-pass -e @inventory/group_vars/keycloak-secrets.yml

    - name: Check that Keycloak admin password was provided
      ansible.builtin.assert:
        that:
          - keycloak_admin_password is defined
          - keycloak_admin_password | length > 0
        fail_msg: |
          Missing Keycloak admin password.
          Create the encrypted Vault file described in the README, then run:
          ansible-playbook playbooks/configure-keycloak-secrets.yml --ask-vault-pass -e @inventory/group_vars/keycloak-secrets.yml

    - name: Wait for Keycloak namespace
      ansible.builtin.command: k3s kubectl get namespace keycloak
      register: keycloak_namespace
      changed_when: false
      retries: 30
      delay: 5
      until: keycloak_namespace.rc == 0

    - name: Create or update Keycloak database secret
      ansible.builtin.shell: |
        k3s kubectl create secret generic keycloak-db-secret \
          --namespace keycloak \
          --from-literal=POSTGRES_DB=keycloak \
          --from-literal=POSTGRES_USER=keycloak \
          --from-literal=POSTGRES_PASSWORD={{ keycloak_db_password | quote }} \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: true
      no_log: true

    - name: Create or update Keycloak admin secret
      ansible.builtin.shell: |
        k3s kubectl create secret generic keycloak-admin-secret \
          --namespace keycloak \
          --from-literal=KC_BOOTSTRAP_ADMIN_USERNAME=admin \
          --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD={{ keycloak_admin_password | quote }} \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: true
      no_log: true

    - name: Verify Keycloak database secret exists
      ansible.builtin.command: >
        k3s kubectl get secret keycloak-db-secret
        -n keycloak
      changed_when: false

    - name: Verify Keycloak admin secret exists
      ansible.builtin.command: >
        k3s kubectl get secret keycloak-admin-secret
        -n keycloak
      changed_when: false
