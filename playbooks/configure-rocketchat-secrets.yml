---
- name: Configure RocketChat MongoDB secrets
  hosts: k3s_control
  become: true
  gather_facts: false

  tasks:
    - name: Check that MongoDB password was provided
      ansible.builtin.assert:
        that:
          - rocketchat_mongo_password is defined
          - rocketchat_mongo_password | length > 0
        fail_msg: |
          Missing MongoDB password for RocketChat.
          Run with:
          ansible-playbook playbooks/configure-rocketchat-secrets.yml -e rocketchat_mongo_password='YOUR_SUPER_SECRET_PASSWORD'

    - name: Wait for rocketchat namespace
      ansible.builtin.command: k3s kubectl get namespace rocketchat
      register: rocketchat_namespace
      changed_when: false
      retries: 30
      delay: 5
      until: rocketchat_namespace.rc == 0

    - name: Create or update RocketChat DB secret
      ansible.builtin.shell: |
        k3s kubectl create secret generic rocketchat-db-secret \
          --namespace rocketchat \
          --from-literal=mongo-root-password='{{ rocketchat_mongo_password }}' \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      changed_when: true
      no_log: true

    - name: Verify RocketChat DB secret exists
      ansible.builtin.command: >
        k3s kubectl get secret rocketchat-db-secret
        -n rocketchat
      changed_when: false
