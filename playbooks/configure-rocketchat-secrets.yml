---
- name: Configure Rocket.Chat Kubernetes secrets
  hosts: k3s_control
  become: true
  gather_facts: false
  run_once: true

  vars_files:
    - ../inventory/group_vars/rocketchat-secrets.yml

  vars:
    rocketchat_namespace: rocketchat
    mongodb_secret_name: rocketchat-mongodb-user

  tasks:
    - name: Verify required Rocket.Chat Vault values exist
      ansible.builtin.assert:
        that:
          - vault_rocketchat_mongodb_username is defined
          - vault_rocketchat_mongodb_username | length > 0
          - vault_rocketchat_mongodb_password is defined
          - vault_rocketchat_mongodb_password | length >= 16
        fail_msg: >-
          Rocket.Chat MongoDB credentials are missing from Ansible Vault.

    - name: Ensure Rocket.Chat namespace exists
      ansible.builtin.command:
        cmd: >
          k3s kubectl create namespace {{ rocketchat_namespace }}
          --dry-run=client
          -o yaml
      register: rocketchat_namespace_manifest
      changed_when: false

    - name: Apply Rocket.Chat namespace
      ansible.builtin.command:
        cmd: k3s kubectl apply -f -
        stdin: "{{ rocketchat_namespace_manifest.stdout }}"
      register: namespace_apply
      changed_when: "'created' in namespace_apply.stdout"

    - name: Render MongoDB password Secret
      ansible.builtin.command:
        cmd: >
          k3s kubectl create secret generic {{ mongodb_secret_name }}
          --namespace {{ rocketchat_namespace }}
          --from-literal=password={{ vault_rocketchat_mongodb_password | quote }}
          --dry-run=client
          -o yaml
      register: mongodb_secret_manifest
      changed_when: false
      no_log: true

    - name: Apply MongoDB password Secret
      ansible.builtin.command:
        cmd: k3s kubectl apply -f -
        stdin: "{{ mongodb_secret_manifest.stdout }}"
      register: mongodb_secret_apply
      changed_when: >-
        'created' in mongodb_secret_apply.stdout or
        'configured' in mongodb_secret_apply.stdout
      no_log: true

    - name: Confirm MongoDB password Secret exists
      ansible.builtin.command:
        cmd: >
          k3s kubectl get secret {{ mongodb_secret_name }}
          --namespace {{ rocketchat_namespace }}
      register: mongodb_secret_check
      changed_when: false

    - name: Display secret status
      ansible.builtin.debug:
        msg: >-
          Rocket.Chat MongoDB credential Secret exists in namespace
          {{ rocketchat_namespace }}.
